<title>Habiba Saleh – Machine Learning Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--cyan:#22e6f2;--ink:#fff}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:#050b1a;font-family:Inter,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0)}
.card{position:relative;width:100%;max-width:440px;min-height:100vh;overflow:hidden;padding:calc(28px + env(safe-area-inset-top,0px)) 28px 36px;background:radial-gradient(circle at 50% 38%,#1b3270 0%,#0d1b45 45%,#050b1a 100%);display:flex;flex-direction:column;align-items:center}
.circuit{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.photo{position:relative;width:62%;max-width:260px;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 0 1px rgba(34,230,242,.25)}
h1{position:relative;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(46px,14vw,62px);margin-top:22px;letter-spacing:.5px;text-align:center}
.role{position:relative;font-family:'Cormorant Garamond',Georgia,serif;color:var(--cyan);font-size:23px;text-align:center;margin:2px 0 24px}
.links{position:relative;width:100%;max-width:330px;display:flex;flex-direction:column;gap:14px}
a.row{display:flex;align-items:center;gap:16px;color:#fff;text-decoration:none;padding:6px 8px;border-radius:12px;transition:background .2s}
a.row:hover,a.row:active{background:rgba(34,230,242,.12)}
.hex{flex:none;width:40px;height:44px;background:var(--cyan);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center}
.hex svg{width:20px;height:20px;fill:#0a1a40}
.row span{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;word-break:break-all}
</style>
